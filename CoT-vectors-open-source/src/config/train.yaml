# 主实验：学习 CoT Vector
defaults:
- encoder: cot_vector
- peft: cot_vector
- _self_
runname: main_experiments
devices: 1
dtype: torch.float16
resume: false
lr: ${peft.lr}
weight_decay: 0.001
warmup_step: 0.1
batch_size: 2
epochs: 1
ce_loss_weight: ${peft.ce_loss_weight}
align_loss_weight: ${peft.align_loss_weight}
strategy: deepspeed_stage_2_offload
accumulate_grad_batches: 2
grad_clip_val: 1.0
precision: 16-mixed
align_num_tokens: 10
model_name: qwen2.5-math-7b
training-mode: TRAIN_STUDENT_DIRECT_Q
dft_loss: false
only_alignment_loss: false
only_ce_loss: false
data:
  stage: acquire
  self_cot_path: null
  name: gsm8k
  num_query_samples: 5000
  num_shot: 0
  max_seq_len: 2048
  seed: 42
  num_workers: 0
  use_self_cot: false
  subset: null
  training_mode: TRAIN_STUDENT_DIRECT_Q
  local_path: null
use_cot_vector_type: licv
only_shift_at_layer: -1
model_path: null
main_experiment: true
